# Deploy to production: SSH to enshait.metakarma.org, pull, rebuild Docker image, recreate container.
# Requires repo secret: DEPLOY_SSH_KEY (private key for root@enshait.metakarma.org)
#
# Skip for a specific commit: include [skip deploy] in the commit message.
# Opt out entirely: disable or delete this workflow, or ask maintainers not to auto-deploy.

name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-enshait
  cancel-in-progress: true

jobs:
  deploy:
    name: SSH pull + docker compose
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && !contains(github.event.head_commit.message || '', '[skip deploy]'))
    steps:
      - name: Start ssh-agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_KEY }}

      - name: Trust host key
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H enshait.metakarma.org >> ~/.ssh/known_hosts

      - name: Pull and restart container
        run: |
          ssh -o IdentitiesOnly=yes root@enshait.metakarma.org \
            'set -eux; cd /home/enshaittify && git pull origin main && docker compose build simulation && docker compose up -d simulation'
